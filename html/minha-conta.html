<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Nakita :D</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    
    <style>
        .texto-fraktur {
    font-family: 'UnifrakturCook', cursive;
    font-size: 44px;
    letter-spacing: 1px;
}
    </style>

<body>
    <!-- Início -->

     <div class="novoMenu">
        <!-- Inicío Container -->
        <div class="container">

            <!-- Inicío Navegação -->
            <div class="navbar">

                <div class="logo">
                        <img src="assets/img/logo.jpg" alt="Nakita" width="125px">
                    </a>
                </div>

                <!-- Início Menu Navegação -->
                <nav>
                    <ul id="MenuItens">
                        <li><a href="" class="link-produto">Sobre</a></li>
                        <li><a href="" class="link-produto">Contato</a></li>
                    </ul>
                </nav>
                <!-- Fim Menu Navegação --> 

                <ion-icon name="menu" alt="" class="menu" onclick="menuce()"></ion-icon>

            </div>
            <!-- Fim Navegação -->

        </div>
        <!-- Fim Container -->
    </div>
        <!-- Fim Container -->

         <!-- Início Minha Conta -->
        <div class="minha-conta">
            <div class="container">
                <div class="linha">

                    <div class="col-2">
                        <img src="assets/img/banner-1.png" alt="" width="100%">
                    </div>

                    <div class="col-2">
                        <div class="formulario">
                            <div class="btn-form">
                                <span onclick="mostrarEntrar()">Entrar</span>
                                <span onclick="mostrarCadastro()">Cadastro</span>
                                <hr id="Indicador">
                            </div>

                            <form action="" method="post" id="EntrarPainel">
                                <input type="email" name="email" id="" placeholder="E-mail de acesso">
                                <input type="password" name="senha" id="" placeholder="Digite sua senha">
                                <button type="submit" name="senEntrar" class="btn">Entrar</button>
                                <a href="" title="">Esqueci minha senha</a>
                            </form>

                            <form action="" method="post" id="CadastroSite">
                                <input type="text" name="nome" id="" placeholder="Nome completo">
                                <input type="email" name="email" id="" placeholder="E-mail de acesso">
                                <input type="password" name="senha" id="" placeholder="Digite sua senha">
                                <button type="submit" name="sendCad" class="btn">Cadastre-se</button>
                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
        <!-- Fim Minha Conta -->

        <!-- Inicío Rodape -->
         <footer class="rodape"> 
            <div class="container">
                <div class="linha-neon"></div>
                <div class="linha-neon"></div>
                <div class="linha">
                    <div class="rodape-col-1">
                        <h3>Baixe nosso App</h3>
                        <p>Baixe nosso App para Android e iOS.</p>
                        <div class="app-logo">
                            <br><img src="assets/img/google.png" alt="Play Store">
                            <img src="assets/img/apple.png" alt="App Store">
                        </div>
                    </div>
                    <div class="rodape-col-2">
                        <h3>Links Úteis</h3>
                        <ul>
                            <li>Cupons</li>
                            <li>Blog</li>
                            <li>Política de Privacidade</li>
                            <li>Contatos</li>
                        </ul>
                    </div>
                </div>

                <br><div class="linha-neon"></div>
                <div class="direitos">
                    &#169; Loja Nakita. Todos os direitos reservados.
                </div>

            </div>
         </footer>
        <!-- Fim Rodape -->


     </div>
    <!-- Fim -->

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script src="assets/js/login.js"></script>
    
</body>
</html>
